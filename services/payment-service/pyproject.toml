[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tuition-payment-service"
version = "0.1.0"
description = "Atomic tuition payment and wallet service"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0",
    "alembic>=1.15",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "PyJWT>=2.10",
    "pydantic-settings>=2.7",
    "pymongo>=4.13",
    "redis>=5.2",
    "SQLAlchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
